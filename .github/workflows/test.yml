name: Run Automation Tests

on:
  push:
    branches: [ main ]
    paths:
      - '08-Automation-Testing/05-OrangeHRM-Automation-Project/**'
  pull_request:
    branches: [ main ]
    paths:
      - '08-Automation-Testing/05-OrangeHRM-Automation-Project/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08-Automation-Testing/05-OrangeHRM-Automation-Project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Install Xvfb (virtual display for Chrome)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Tests
        working-directory: 08-Automation-Testing/05-OrangeHRM-Automation-Project
        run: mvn test

      - name: Upload execution screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-screenshots
          path: 08-Automation-Testing/05-OrangeHRM-Automation-Project/screenshots/

      - name: Upload TestNG report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-report
          path: 08-Automation-Testing/05-OrangeHRM-Automation-Project/test-output/

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            08-Automation-Testing/05-OrangeHRM-Automation-Project/target/surefire-reports/
            08-Automation-Testing/05-OrangeHRM-Automation-Project/screenshots/
          if-no-files-found: warn
